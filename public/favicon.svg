<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- NepsAi Favicon · Realistic 3D Optical Candlestick Mark · Created by @raazkhnl -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="f-bg" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#090D17"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>

    <!-- Beveled Rim Gradient -->
    <linearGradient id="f-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Pillar 1 Gradient (Cyan 3D Glass) -->
    <linearGradient id="f-cyan-pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Pillar 2 Gradient (Emerald/Teal 3D Breakout) -->
    <linearGradient id="f-green-pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="35%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Diagonal Optical Prism -->
    <linearGradient id="f-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="f-diag-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Container Base Plate -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#f-bg)" stroke="url(#f-border)" stroke-width="1.8"/>

  <!-- Candlestick Wicks with Glow -->
  <line x1="20" y1="13" x2="20" y2="51" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="44" y1="9" x2="44" y2="53" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Left Candlestick Body (Cyan with Top/Left Specular Glint) -->
  <rect x="16" y="20" width="8" height="26" rx="3" fill="url(#f-cyan-pillar)"/>
  <line x1="17.5" y1="22" x2="17.5" y2="44" stroke="#E0F2FE" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

  <!-- Right Candlestick Body (Breakout Emerald with Specular Rim) -->
  <rect x="40" y="15" width="8" height="31" rx="3" fill="url(#f-green-pillar)"/>
  <line x1="41.5" y1="17" x2="41.5" y2="44" stroke="#F0FDF4" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

  <!-- 3D Diagonal Connecting Prism ("N" Bridge) -->
  <polygon points="24,20 40,36 40,42 24,26" fill="url(#f-diag)"/>
  <!-- Top Specular Ridge Line -->
  <line x1="24" y1="20" x2="40" y2="36" stroke="url(#f-diag-highlight)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- AI Apex 4-Point Diamond Flare (✦) -->
  <g transform="translate(44, 9)">
    <circle r="7" fill="#00F2FE" opacity="0.35"/>
    <path d="M 0 -6 Q 0 0, -1.2 0 Q 0 0, 0 6 Q 0 0, 1.2 0 Q 0 0, 0 -6 Z" fill="#FFFFFF"/>
    <path d="M -6 0 Q 0 0, 0 -1.2 Q 0 0, 6 0 Q 0 0, 0 1.2 Q 0 0, -6 0 Z" fill="#FFFFFF"/>
    <circle r="1.3" fill="#FFFFFF"/>
  </g>
</svg>
